<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: transparent;
      padding: 8px 0;
    }

    .view { display: flex; flex-direction: column; gap: 10px; }
    .view[hidden] { display: none !important; }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: #999;
    }

    input {
      background: #252525;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 8px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #666; }

    button {
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 12px;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #3a3a3a; }
    button:disabled { opacity: 0.5; cursor: default; }

    .btn-danger {
      background: none;
      border: 1px solid transparent;
      color: #d55;
      padding: 6px 12px;
    }
    .btn-danger:hover { color: #f66; }

    .error { color: #e55; font-size: 12px; }

    .connected-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .connected-label {
      color: #5a5;
      font-size: 13px;
      font-weight: 500;
    }

    .connected-hint {
      color: #777;
      font-size: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #555;
      font-size: 11px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #333;
    }

    .link {
      background: none;
      border: none;
      padding: 0;
      color: #888;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
    }
    .link:hover { color: #bbb; }

    #token-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>

  <div id="signin" class="view" hidden>
    <label>
      API URL
      <input id="input-url" type="url" placeholder="https://wheel-api-production-28d3.up.railway.app" />
    </label>
    <label>
      Email
      <input id="input-email" type="email" placeholder="you@example.com" />
    </label>
    <label>
      Password
      <input id="input-password" type="password" placeholder="Password" />
    </label>
    <button id="btn-signin">Sign in</button>
    <div class="divider"><span>or</span></div>
    <button id="btn-toggle-token" class="link">Use an API token instead</button>
    <div id="token-section" hidden>
      <label>
        API Token
        <input id="input-token" type="password" placeholder="wht_..." />
      </label>
      <button id="btn-save-token">Connect</button>
    </div>
    <p id="signin-error" class="error" hidden></p>
  </div>

  <div id="connected" class="view" hidden>
    <div class="connected-row">
      <div>
        <div class="connected-label">Connected</div>
        <div class="connected-hint" id="connected-url"></div>
      </div>
      <button id="btn-signout" class="btn-danger">Sign Out</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
