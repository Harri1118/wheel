<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel Inspector</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .inspector-empty {
      color: #666;
      font-size: 12px;
      padding: 8px 0;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .node-type-badge {
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      background: #2a2a3a;
      color: #8888cc;
    }
    .node-type-badge.agent { background: #2a3a2a; color: #6a6; }
    .node-type-badge.ctx { background: #3a2a2a; color: #a86; }
    .node-type-badge.table { background: #2a2a3a; color: #68a; }
    .node-type-badge.endpoint { background: #3a3a2a; color: #aa6; }
    .node-type-badge.script { background: #2a3a3a; color: #6aa; }
    .node-type-badge.mcp { background: #3a2a3a; color: #a6a; }
    .node-type-badge.vault { background: #2a2a2a; color: #888; }
    .node-type-badge.chest { background: #2a2a2a; color: #888; }
    .node-type-badge.tool { background: #3a2a2a; color: #a66; }

    .node-name {
      font-size: 13px;
      font-weight: 600;
      color: #ddd;
    }

    .section {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field-label {
      font-size: 11px;
      color: #888;
      font-weight: 500;
    }

    .field-input, .field-select {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 4px 6px;
      color: #ddd;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    .field-input:focus, .field-select:focus { border-color: #555; }

    .field-textarea {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 4px 6px;
      color: #ddd;
      font-size: 12px;
      outline: none;
      width: 100%;
      resize: vertical;
      min-height: 48px;
      font-family: "SF Mono", "Fira Code", monospace;
      line-height: 1.4;
    }
    .field-textarea:focus { border-color: #555; }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-switch {
      position: relative;
      width: 28px;
      height: 16px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      left: 2px;
      top: 2px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider { background: #2a4a2a; }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(12px); background: #6a6; }

    .toggle-label {
      font-size: 11px;
      color: #bbb;
    }

    .btn-sm {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 3px;
      padding: 2px 8px;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sm:hover { background: #333; color: #ddd; }
    .btn-sm:disabled { opacity: 0.4; cursor: default; }
    .btn-sm.primary { background: #2a3a2a; border-color: #3a4a3a; color: #8b8; }
    .btn-sm.primary:hover { background: #3a4a3a; }
    .btn-sm.danger { color: #a66; }
    .btn-sm.danger:hover { color: #c88; }

    .save-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .save-status { font-size: 11px; color: #666; }
    .save-status.ok { color: #5a5; }
    .save-status.err { color: #e55; }

    .column-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 3px;
    }

    .column-row .field-input { flex: 1; }
    .column-row .field-select { width: 80px; flex-shrink: 0; }

    .columns-list { margin-bottom: 4px; }

    .wire-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 0;
      font-size: 12px;
    }

    .wire-dir { color: #888; font-size: 11px; }
    .wire-type { font-weight: 500; }
    .wire-type-read { color: #6a6; }
    .wire-type-write { color: #a66; }
    .wire-type-send { color: #66a; }
    .wire-peer { color: #aaa; }
    .wire-remove { margin-left: auto; padding: 0 4px; }
    .wire-empty { color: #555; font-size: 11px; }

    .wire-add-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-top: 4px;
    }
    .wire-peer-select { flex: 1; }
    .wire-type-select { width: 70px; flex-shrink: 0; }

    .agent-log {
      max-height: 150px;
      overflow-y: auto;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 3px;
      padding: 4px;
    }

    .log-line {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 10px;
      color: #999;
      padding: 1px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-line.log-stderr { color: #c66; }
  </style>
</head>
<body>
  <div id="inspector-root">
    <div id="inspector-empty" class="inspector-empty">
      No Wheel node selected. Open a project on the canvas to inspect nodes.
    </div>
    <div id="inspector-content" hidden></div>
  </div>
  <script src="wheel-api.js"></script>
  <script src="inspector.js"></script>
</body>
</html>
