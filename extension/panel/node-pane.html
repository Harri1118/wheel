<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel Node</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #ddd;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .node-card {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .type-badge {
      background: #2a2a3a;
      color: #8888cc;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .type-badge.agent { background: #2a3a2a; color: #6a6; }
    .type-badge.ctx { background: #3a2a2a; color: #a86; }
    .type-badge.table { background: #2a2a3a; color: #68a; }
    .type-badge.endpoint { background: #3a3a2a; color: #aa6; }
    .type-badge.script { background: #2a3a3a; color: #6aa; }
    .type-badge.mcp { background: #3a2a3a; color: #a6a; }
    .type-badge.vault { background: #2a2a2a; color: #888; }
    .type-badge.chest { background: #2a2a2a; color: #888; }
    .type-badge.tool { background: #3a2a2a; color: #a66; }

    .node-name {
      font-size: 14px;
      font-weight: 600;
      color: #eee;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }

    .status-dot.running { background: #5a5; }
    .status-dot.idle { background: #888; }
    .status-dot.stopped { background: #555; }
    .status-dot.error { background: #e55; }

    .status-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .btn-sm {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 3px;
      padding: 2px 8px;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sm:hover { background: #333; color: #ddd; }
    .btn-sm:disabled { opacity: 0.4; cursor: default; }
    .btn-sm.primary { background: #2a3a2a; border-color: #3a4a3a; color: #8b8; }
    .btn-sm.primary:hover { background: #3a4a3a; }
    .btn-sm.danger { color: #a66; }
    .btn-sm.danger:hover { color: #c88; }

    .harness-label {
      background: #252525;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #999;
    }

    .wires-row {
      font-size: 11px;
      color: #777;
    }

    .wire-read { color: #6a6; }
    .wire-write { color: #a66; }
    .wire-send { color: #66a; }

    .config-preview {
      font-size: 11px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading {
      color: #666;
      font-size: 12px;
      padding: 16px;
    }

    .separator {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 4px 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 11px;
      color: #888;
      font-weight: 500;
    }

    .field-input {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 8px;
      color: #ddd;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    .field-input:focus { border-color: #555; }

    .field-select {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 8px;
      color: #ddd;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    .field-select:focus { border-color: #555; }

    .field-textarea {
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 8px;
      color: #ddd;
      font-size: 12px;
      outline: none;
      width: 100%;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
      line-height: 1.4;
    }
    .field-textarea:focus { border-color: #555; }

    .field-hint {
      font-size: 10px;
      color: #555;
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .save-status {
      font-size: 11px;
      color: #666;
    }
    .save-status.ok { color: #5a5; }
    .save-status.err { color: #e55; }

    .toggle-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .toggle-switch {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: #2a4a2a;
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(14px);
      background: #6a6;
    }

    .toggle-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .toggle-label {
      font-size: 12px;
      color: #ccc;
    }

    .toggle-desc {
      font-size: 10px;
      color: #555;
    }

    /* --- runtime UI --- */

    .runtime-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .msg-log {
      max-height: 180px;
      overflow-y: auto;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 4px;
      padding: 6px;
      font-family: "SF Mono", "Fira Code", "Menlo", monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    .msg-log:empty::before {
      content: 'No messages yet.';
      color: #444;
    }

    .log-entry {
      padding: 2px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-entry.log-in { color: #6a6; }
    .log-entry.log-out { color: #8af; }
    .log-entry.log-system { color: #888; font-style: italic; }
    .log-entry.log-stderr { color: #c66; }

    .msg-input-row {
      display: flex;
      gap: 4px;
    }
    .msg-input-row textarea {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 8px;
      color: #ddd;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 32px;
      max-height: 80px;
    }
    .msg-input-row textarea:focus { border-color: #555; }

    .table-viewer {
      overflow-x: auto;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 4px;
    }
    .table-viewer table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .table-viewer th {
      background: #1e1e1e;
      color: #999;
      font-weight: 600;
      text-align: left;
      padding: 4px 8px;
      border-bottom: 1px solid #2a2a2a;
      white-space: nowrap;
    }
    .table-viewer td {
      padding: 3px 8px;
      border-bottom: 1px solid #1e1e1e;
      color: #bbb;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .table-viewer .empty-table {
      color: #555;
      padding: 8px;
      text-align: center;
    }

    .sql-row {
      display: flex;
      gap: 4px;
    }
    .sql-row input {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 8px;
      color: #ddd;
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", "Menlo", monospace;
      outline: none;
    }
    .sql-row input:focus { border-color: #555; }

    .vault-row {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .vault-row input {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 8px;
      color: #ddd;
      font-size: 12px;
      outline: none;
    }
    .vault-row input:focus { border-color: #555; }

    .file-list {
      list-style: none;
      background: #151515;
      border: 1px solid #252525;
      border-radius: 4px;
      padding: 4px 0;
      max-height: 150px;
      overflow-y: auto;
      font-size: 11px;
    }
    .file-list li {
      padding: 2px 8px;
      color: #bbb;
      font-family: "SF Mono", "Fira Code", "Menlo", monospace;
    }
    .file-list:empty::before {
      content: 'No files.';
      color: #444;
      padding: 8px;
      display: block;
      text-align: center;
    }

    .section-label {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .runtime-error {
      font-size: 11px;
      color: #c66;
      padding: 2px 0;
    }

    .op-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .op-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #bbb;
    }
    .op-method {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      text-transform: uppercase;
    }
    .op-method.get { background: #1a3a1a; color: #6a6; }
    .op-method.post { background: #1a2a3a; color: #68a; }
    .op-method.put { background: #3a3a1a; color: #aa6; }
    .op-method.delete { background: #3a1a1a; color: #a66; }
    .op-method.patch { background: #2a2a3a; color: #88c; }
  </style>
</head>
<body>
  <div id="node-card" class="node-card">
    <div class="loading" id="loading">Loading node...</div>
  </div>
  <script src="wheel-api.js"></script>
  <script src="node-pane.js"></script>
</body>
</html>
