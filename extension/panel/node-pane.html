<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel Node</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #ddd;
      overflow: hidden;
    }

    .node-card {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    .node-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .type-badge {
      background: #2a2a3a;
      color: #8888cc;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .type-badge.agent { background: #2a3a2a; color: #6a6; }
    .type-badge.ctx { background: #3a2a2a; color: #a86; }
    .type-badge.table { background: #2a2a3a; color: #68a; }
    .type-badge.endpoint { background: #3a3a2a; color: #aa6; }
    .type-badge.script { background: #2a3a3a; color: #6aa; }
    .type-badge.mcp { background: #3a2a3a; color: #a6a; }
    .type-badge.vault { background: #2a2a2a; color: #888; }
    .type-badge.tool { background: #3a2a2a; color: #a66; }

    .node-name {
      font-size: 14px;
      font-weight: 600;
      color: #eee;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
    }

    .status-dot.running { background: #5a5; }
    .status-dot.idle { background: #888; }
    .status-dot.stopped { background: #555; }
    .status-dot.error { background: #e55; }

    .harness-label {
      margin-left: auto;
      background: #252525;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #999;
    }

    .wires-row {
      font-size: 11px;
      color: #777;
    }

    .wire-read { color: #6a6; }
    .wire-write { color: #a66; }
    .wire-send { color: #66a; }

    .config-preview {
      font-size: 11px;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loading {
      color: #666;
      font-size: 12px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div id="node-card" class="node-card">
    <div class="loading" id="loading">Loading node...</div>
  </div>
  <script src="wheel-api.js"></script>
  <script src="node-pane.js"></script>
</body>
</html>
