<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel Nodes</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #palette-root {
      padding: 4px 0;
    }
    .palette-hint {
      color: #777;
      font-size: 11px;
      font-style: italic;
      padding: 2px 0 6px;
    }
    .palette-empty {
      color: #666;
      font-size: 12px;
      padding: 8px 0;
    }
    #palette-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .palette-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: #ccc;
      font-size: 13px;
      padding: 7px 6px;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      width: 100%;
    }
    .palette-btn:hover {
      background: rgba(255,255,255,0.06);
    }
    .palette-btn svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: #e08060;
    }
  </style>
</head>
<body>
  <div id="palette-root">
    <div id="palette-empty" class="palette-empty">
      Open a Wheel project to place nodes.
    </div>
    <div id="palette-active" hidden>
      <div class="palette-hint">Click to place on board</div>
      <div id="palette-list"></div>
    </div>
  </div>
  <script src="wheel-api.js"></script>
  <script src="palette.js"></script>
</body>
</html>
