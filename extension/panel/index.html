<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <div id="setup" class="view" hidden>
      <h2>Configure Wheel</h2>
      <label>
        API URL
        <input id="input-url" type="url" placeholder="https://api.wheel.dev" />
      </label>
      <label>
        API Token
        <input id="input-token" type="password" placeholder="wht_..." />
      </label>
      <button id="btn-save">Save</button>
      <p id="setup-error" class="error" hidden></p>
    </div>

    <div id="status" class="view" hidden>
      <div class="header">
        <span class="dot" id="dot"></span>
        <span id="status-label">Connecting</span>
        <button id="btn-configure" class="link">Settings</button>
      </div>
      <div id="info">
        <p id="api-url-display" class="dim"></p>
        <p id="project-count" class="dim"></p>
      </div>

      <div id="projects-section" hidden>
        <h3>Projects</h3>
        <ul id="project-list"></ul>
      </div>

      <div id="sync-status" hidden>
        <div class="header">
          <span class="dot" id="sync-dot"></span>
          <span id="sync-label">Not synced</span>
        </div>
        <p id="sync-detail" class="dim"></p>
      </div>

      <div id="log">
        <h3>Recent tool calls</h3>
        <ul id="call-log"></ul>
      </div>
    </div>
  </div>
  <script src="wheel-api.js"></script>
  <script src="spawn-plan.js"></script>
  <script src="wheel-events.js"></script>
  <script src="board-sync.js"></script>
  <script src="main.js"></script>
</body>
</html>
